<h2 class="title" mat-dialog-title>{{data.dialogTitle}}</h2>

<mat-dialog-content>
  <div class="content">
    <p class="message">{{data.dialogMessage}}</p>
    <p class="name">{{data.itemToDelete}}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button [mat-dialog-close]="false" class="cancel-button" matButton>{{textLiterals.Cancel}}</button>
  <button [mat-dialog-close]="true" class="delete-button" matButton>{{textLiterals.Delete}}</button>
</mat-dialog-actions>
